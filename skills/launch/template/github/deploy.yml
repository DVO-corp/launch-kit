# Copy to .github/workflows/deploy.yml.
# Every push to main: build the image, push it to GitHub's registry, restart the app on the server.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST      server address
#   DEPLOY_USER      SSH user
#   DEPLOY_SSH_KEY   private key of a key pair made for deploys only
#   DEPLOY_PATH      folder of the stack on the server, e.g. /opt/apps/myapp/deploy
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Image name in lower case
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Restart on the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          TAG: ${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # The token is piped over SSH and is valid only while this job runs.
          printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new \
            "$USER_NAME@$HOST" "
              set -e
              docker login ghcr.io -u '$ACTOR' --password-stdin >/dev/null
              cd '$DEPLOY_PATH'
              APP_IMAGE='$IMAGE:$TAG' docker compose pull -q app
              APP_IMAGE='$IMAGE:$TAG' docker compose up -d --no-build --remove-orphans
              sed -i 's|^APP_IMAGE=.*|APP_IMAGE=$IMAGE:$TAG|' .env
              docker logout ghcr.io >/dev/null
              docker image prune -f >/dev/null
              docker compose ps
            "

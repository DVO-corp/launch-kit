# Production stack for one app on one server.
# Lives in <your project>/deploy/. Settings: .env (stack) and app.env (your app).
#
#   docker compose up -d --build        build on this machine and start
#   docker compose logs -f app          follow the app's logs
#
# Optional parts are switched on with COMPOSE_PROFILES in .env:
#   db          Postgres on this server
#   backup      nightly dumps of the database (local Postgres or an external one)
#   offsite     copies the dumps to S3-compatible storage
#   monitoring  Grafana + Loki + Prometheus + Alloy (logs, host and HTTP metrics)

name: ${STACK_NAME:-app}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2.11.9
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      APP_PORT: ${APP_PORT:-3000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    logging: *logging

  app:
    image: ${APP_IMAGE:-app:local}
    build:
      context: ..
      dockerfile: ${APP_DOCKERFILE:-Dockerfile}
    restart: unless-stopped
    env_file:
      - path: app.env
        required: false
    environment:
      PORT: ${APP_PORT:-3000}
    expose:
      - "${APP_PORT:-3000}"
    logging: *logging

  db:
    profiles: ["db"]
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  backup:
    profiles: ["backup"]
    image: postgres:18
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/backup.sh"]
    command: ["loop"]
    environment:
      # Set BACKUP_DATABASE_URL to dump an external database (Supabase, Neon …);
      # leave it empty to dump the "db" service.
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:-}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - ./backups:/backups
    logging: *logging

  offsite:
    profiles: ["offsite"]
    image: rclone/rclone:1.76.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    # "copy", not "sync": a dump pruned here stays in the bucket. Put a lifecycle
    # rule on the bucket to expire old objects.
    command:
      - |
        while :; do
          rclone copy /backups "offsite:$${OFFSITE_BUCKET}/$${OFFSITE_PREFIX}" --include "*.sql.gz" \
            && echo "offsite copy ok" || echo "offsite copy FAILED"
          sleep 3600
        done
    environment:
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${OFFSITE_PROVIDER:-Other}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${OFFSITE_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_REGION: ${OFFSITE_REGION:-auto}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${OFFSITE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${OFFSITE_SECRET_ACCESS_KEY:-}
      OFFSITE_BUCKET: ${OFFSITE_BUCKET:-}
      OFFSITE_PREFIX: ${OFFSITE_PREFIX:-db}
    volumes:
      - ./backups:/backups:ro
    logging: *logging

  alloy:
    profiles: ["monitoring"]
    image: grafana/alloy:v1.22.0
    restart: unless-stopped
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    environment:
      STACK_NAME: ${STACK_NAME:-app}
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - alloy_data:/var/lib/alloy/data
    logging: *logging

  loki:
    profiles: ["monitoring"]
    image: grafana/loki:3.6.22
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./monitoring/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    mem_limit: 512m
    logging: *logging

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${METRICS_RETENTION:-15d}
      - --web.enable-remote-write-receiver
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    mem_limit: 512m
    logging: *logging

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    # Not public: reach it through an SSH tunnel,
    #   ssh -L 3001:127.0.0.1:3001 user@server   →   http://localhost:3001
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  db_data:
  alloy_data:
  loki_data:
  prometheus_data:
  grafana_data:
